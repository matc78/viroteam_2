# Quality gates monorepo — Flutter, portal Next.js, Cloud Functions.
# Push sur main/master/develop : full matrix.
# PR : jobs filtrés par chemins touchés (plus ci.yml lui-même).

name: CI

on:
  push:
    branches: [main, master, develop]
    tags:
      - "v*"
      - "release-v*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      portal: ${{ steps.filter.outputs.portal }}
      functions: ${{ steps.filter.outputs.functions }}
      force_all: ${{ steps.force.outputs.value }}
    steps:
      - uses: actions/checkout@v6

      - name: Force full matrix on protected branches and release tags
        id: force
        run: |
          if [ "${{ github.event_name }}" = "push" ] && {
            [ "${{ github.ref }}" = "refs/heads/main" ] ||
            [ "${{ github.ref }}" = "refs/heads/master" ] ||
            [ "${{ github.ref }}" = "refs/heads/develop" ] ||
            [[ "${{ github.ref }}" == refs/tags/v* ]] ||
            [[ "${{ github.ref }}" == refs/tags/release-v* ]]
          }; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'android/**'
              - '.fvmrc'
              - '.fvm/**'
              - '.github/workflows/ci.yml'
            portal:
              - 'portal/**'
              - '.github/workflows/ci.yml'
            functions:
              - 'functions/**'
              - '.github/workflows/ci.yml'

  flutter:
    name: Flutter analyze & test
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Aligné sur .fvmrc / .fvm/fvm_config.json
          flutter-version: "3.44.8"
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  portal:
    name: Portal lint & build
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    # Clés Firebase web publiques (même projet que apphosting.yaml) — pas de secrets Admin.
    # CI valide contre v2-dev ; App Hosting prod utilise v2-prod (apphosting.yaml).
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDC11KSpLJY-C07QNExa3AHuXHKk_DpXkQ
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: viroteam-75303.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: viroteam-75303
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: viroteam-75303.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "396501317680"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:396501317680:web:93d4f0b325ff9c876fd5f5
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-RNK62HGCVT
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: v2-dev
      NEXT_PUBLIC_DEV_AUTH_BYPASS: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  functions:
    name: Functions build
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run build
