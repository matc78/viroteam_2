# Déploie toutes les Cloud Functions (dual *Dev → v2-dev + prod → v2-prod).
#
# Un seul tag par version : chaque déploiement pousse déjà les deux variantes.
# Deux tags en parallèle se disputaient la création des nouvelles functions
# (409 en boucle jusqu'au timeout).
#
# Tags :
#   functions-v1.2.3 → environment firebase-prod (même projet GCP)
# workflow_dispatch  → redéploiement manuel sans tag

name: Deploy functions

on:
  push:
    tags:
      - "functions-v*"
  workflow_dispatch:

# Jamais deux déploiements en même temps sur le projet : le suivant attend.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firebase-prod
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Même JSON que le SA portal si les rôles Functions Admin sont accordés.
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEPLOY }}

      - name: Set up Firebase CLI
        run: npm install -g firebase-tools
        working-directory: .

      - run: npm ci
      - run: npm run build

      # Params publics (defineString) — secrets restent dans Secret Manager.
      # Requis en CI non-interactive (sinon firebase refuse le deploy).
      - name: Write functions dotenv params
        working-directory: .
        run: |
          cat > functions/.env.viroteam-75303 <<'EOF'
          HELLOASSO_API_BASE=https://api.helloasso.com
          BREVO_SENDER_EMAIL=noreply@viroteam.com
          BREVO_SENDER_NAME=Guy · ViroTeam
          INVITE_JOIN_BASE_URL=https://www.viroteam.com
          PLAY_STORE_URL=https://play.google.com/store/apps/details?id=com.viroteam.viro_team
          APP_STORE_URL=https://apps.apple.com/fr/app/viroteam/id6807822265
          # Messagerie cachée en prod : aucun push chat tant que false.
          CHAT_MESSAGING_LIVE=false
          EOF

      - name: Deploy all functions (dual Dev + Prod)
        run: |
          echo "Un deploy pousse toutes les functions duales (*Dev + prod)."
          firebase deploy --only functions \
            --project viroteam-75303 \
            --non-interactive
        working-directory: .
