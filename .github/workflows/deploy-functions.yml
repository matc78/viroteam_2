# Déploie toutes les Cloud Functions (dual *Dev → v2-dev + prod → v2-prod).
#
# Tags :
#   functions-dev-v1.2.3 → environment firebase-dev (même projet GCP)
#   functions-v1.2.3     → environment firebase-prod
# workflow_dispatch      → input target = dev | prod

name: Deploy functions

on:
  push:
    tags:
      - "functions-v*"
      - "functions-dev-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Cible processuelle (dev ou prod)"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  resolve-target:
    name: Resolve target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve deploy target
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ inputs.target }}"
          elif [[ "${{ github.ref }}" == refs/tags/functions-dev-v* ]]; then
            target="dev"
          elif [[ "${{ github.ref }}" == refs/tags/functions-v* ]]; then
            target="prod"
          else
            echo "Tag ou cible non reconnue."
            exit 1
          fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          if [ "$target" = "prod" ]; then
            echo "environment=firebase-prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=firebase-dev" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Cloud Functions
    needs: resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve-target.outputs.environment }}
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Même JSON que le SA portal si les rôles Functions Admin sont accordés.
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEPLOY }}

      - name: Set up Firebase CLI
        run: npm install -g firebase-tools
        working-directory: .

      - run: npm ci
      - run: npm run build

      - name: Deploy all functions (dual Dev + Prod)
        run: |
          echo "Cible processuelle: ${{ needs.resolve-target.outputs.target }}"
          echo "Un deploy pousse toutes les functions duales (*Dev + prod)."
          firebase deploy --only functions \
            --project viroteam-75303 \
            --non-interactive
        working-directory: .
