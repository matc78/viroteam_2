# Release Android — APK/AAB signés, GitHub Release, Play Store.
#
# Prérequis : le job « Flutter analyze & test » du workflow CI doit avoir réussi
# sur le commit tagué (gate verify-ci). La CI tourne aussi sur les tags v* / release-v*.
#
# Tags :
#   v1.2.3         → artifacts + GitHub Release + Play internal
#   release-v1.2.3 → artifacts + Play production (pas de GitHub Release)
# workflow_dispatch → artifacts seulement (pas Play, pas GitHub Release)

name: Release Android

on:
  push:
    tags:
      - "v*"
      - "release-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version sans préfixe v (ex. 1.0.0). Utilisée hors tag."
        required: false
        default: "0.0.0-manual"

permissions:
  contents: write
  actions: read

jobs:
  verify-ci:
    name: Verify CI passed on commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Flutter CI job success
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: ^Flutter analyze & test$
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success

  build:
    name: Build APK & AAB
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Restore Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PROPERTIES" ]; then
            echo "Secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEY_PROPERTIES requis."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/release-v* ]]; then
            echo "name=${GITHUB_REF_NAME#release-v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get

      - name: Resolve build number
        id: build_number
        run: echo "value=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.build_number.outputs.value }}

      - name: Build release App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.build_number.outputs.value }}

      - name: Verify Play Store manifest policy
        run: |
          merged_manifest=$(find build/app/intermediates -path "*release*AndroidManifest.xml" | head -1)
          if [ -z "$merged_manifest" ]; then
            echo "Manifeste fusionné introuvable."
            exit 1
          fi
          echo "Manifeste vérifié: $merged_manifest"
          forbidden_permissions=(
            "com.google.android.gms.permission.AD_ID"
            "android.permission.ACCESS_ADSERVICES_AD_ID"
            "android.permission.ACCESS_ADSERVICES_ATTRIBUTION"
            "android.permission.READ_MEDIA_IMAGES"
            "android.permission.READ_MEDIA_VIDEO"
            "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"
            "android.permission.READ_EXTERNAL_STORAGE"
            "android.permission.WRITE_EXTERNAL_STORAGE"
          )
          for permission in "${forbidden_permissions[@]}"; do
            if grep -q "$permission" "$merged_manifest"; then
              echo "Permission interdite détectée dans le manifeste fusionné: $permission"
              grep "$permission" "$merged_manifest"
              exit 1
            fi
          done
          echo "Aucune permission bloquante détectée."

      - name: Prepare artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "viro-team-v2-${{ steps.version.outputs.name }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "viro-team-v2-${{ steps.version.outputs.name }}.aab"

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: viro-team-v2-${{ steps.version.outputs.name }}
          path: |
            viro-team-v2-${{ steps.version.outputs.name }}.apk
            viro-team-v2-${{ steps.version.outputs.name }}.aab

  github-release:
    name: Publish GitHub Release
    needs: build
    # Tag v* uniquement (pas release-v*, pas workflow_dispatch)
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/release-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: viro-team-v2-${{ needs.build.outputs.version }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            viro-team-v2-${{ needs.build.outputs.version }}.apk
            viro-team-v2-${{ needs.build.outputs.version }}.aab
          generate_release_notes: true

  play-internal:
    name: Deploy Play Store (internal)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/release-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-store
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: viro-team-v2-${{ needs.build.outputs.version }}

      - name: Deploy to Google Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.viroteam.viro_team
          releaseFiles: viro-team-v2-${{ needs.build.outputs.version }}.aab
          tracks: internal
          status: completed
          changesNotSentForReview: true

  play-production:
    name: Deploy Play Store (production)
    needs: build
    if: startsWith(github.ref, 'refs/tags/release-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-store
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: viro-team-v2-${{ needs.build.outputs.version }}

      - name: Deploy to Google Play Store (production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.viroteam.viro_team
          releaseFiles: viro-team-v2-${{ needs.build.outputs.version }}.aab
          tracks: production
          status: completed
          changesNotSentForReview: true
