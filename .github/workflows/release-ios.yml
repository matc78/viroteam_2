name: Release iOS

# Construit l'IPA iOS et l'envoie sur App Store Connect (TestFlight) sur un tag
# `v*` / `release-v*`, ou à la demande.
#
# Signature : MANUELLE dès que le secret IOS_DIST_P12_BASE64 existe (certificat
# Apple Distribution + profil App Store fixes, importés dans un trousseau
# temporaire du runner). Sans ce secret, repli sur la signature « cloud » par la
# clé API — à éviter : chaque run crée alors un certificat Apple Development
# jetable, et Apple en limite le nombre (incident du 28/10/2026 : « Your account
# has reached the maximum number of certificates », plus aucune build possible).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   ASC_KEY_ID      — ID de la clé API App Store Connect (ex. 29DPBG3FGV)
#   ASC_ISSUER_ID   — Issuer ID (UUID, page Intégrations)
#   ASC_API_KEY_P8  — contenu du fichier AuthKey_<KEY_ID>.p8 (texte, avec BEGIN/END)
#   IOS_DIST_P12_BASE64         — certificat Apple Distribution + clé privée (.p12) en base64
#   IOS_DIST_P12_PASSWORD       — mot de passe de ce .p12
#   IOS_APPSTORE_PROFILE_BASE64 — profil App Store `com.viroteam.viroTeam` (.mobileprovision) en base64
# Voir docs/DEPLOY_IOS.md pour les produire depuis un Mac.
#
# Le build number = 100 + numéro du run GitHub : toujours croissant, jamais en
# conflit avec les builds envoyés à la main (≤ 20). Le version name vient du
# pubspec, contrôlé par tool/check_app_version.mjs comme pour Android.
#
# Sur un tag, le job « Notes App Store Connect » attend le traitement de la
# build puis écrit les notes de distribution/release-notes/<X.Y.Z>.txt :
#   v*         → « What to Test » TestFlight
#   release-v* → idem + version App Store X.Y.Z préparée (Nouveautés, build
#                attachée), sans envoi en review — soumission manuelle.

on:
  push:
    tags:
      - "v*"
      - "release-v*"
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version (vide = pubspec)"
        required: false
        default: ""

concurrency:
  group: release-ios
  cancel-in-progress: false

env:
  BUNDLE_ID: com.viroteam.viroTeam
  TEAM_ID: 7W9T8GP8NG
  SCHEME: Runner

jobs:
  build-upload:
    name: Build IPA & upload to App Store Connect
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.ver.outputs.number }}
    steps:
      - uses: actions/checkout@v6

      - name: Vérifie l'alignement de version (tag ↔ pubspec ↔ ProjectConfig)
        if: startsWith(github.ref, 'refs/tags/')
        run: node tool/check_app_version.mjs --tag="${GITHUB_REF_NAME}"

      - name: Vérifie les notes de version
        if: startsWith(github.ref, 'refs/tags/')
        run: node tool/release_notes.mjs

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
          xcodebuild -version

      - name: Flutter (version épinglée par .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Clé API App Store Connect
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -e
          test -n "$ASC_API_KEY_P8" || { echo "Secret ASC_API_KEY_P8 manquant"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "Secret ASC_KEY_ID manquant"; exit 1; }
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Dépendances
        run: |
          flutter pub get
          # `pod install` échoue si Podfile.lock pinne un Firebase SDK
          # plus ancien que celui exigé par FlutterFire (ex. 12.13 vs 12.19).
          cd ios && (pod install --repo-update || pod update)

      - name: Archive Podfile.lock (resync repo si mis à jour)
        uses: actions/upload-artifact@v6
        with:
          name: ios-Podfile.lock
          path: ios/Podfile.lock
          if-no-files-found: ignore

      - name: Version et build number
        id: ver
        run: |
          NAME="${{ github.event.inputs.build_name }}"
          if [ -z "$NAME" ]; then NAME=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml); fi
          NUM=$((100 + GITHUB_RUN_NUMBER))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "ViroTeam $NAME ($NUM)"

      - name: Config Flutter (release, sans signature)
        run: flutter build ios --config-only --release --build-name="${{ steps.ver.outputs.name }}" --build-number="${{ steps.ver.outputs.number }}"

      - name: Certificat et profil fixes (signature manuelle)
        id: signing
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -e
          if [ -z "$IOS_DIST_P12_BASE64" ]; then
            echo "::warning::Secret IOS_DIST_P12_BASE64 absent : signature automatique (crée un certificat Apple Development jetable à chaque run, quota Apple limité)"
            echo "style=automatic" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$IOS_APPSTORE_PROFILE_BASE64" || { echo "Secret IOS_APPSTORE_PROFILE_BASE64 manquant"; exit 1; }
          test -n "$IOS_DIST_P12_PASSWORD" || { echo "Secret IOS_DIST_P12_PASSWORD manquant"; exit 1; }

          # Trousseau temporaire du runner, déverrouillé pour codesign.
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" \
            || { echo "Le .p12 ne contient pas d'identité Apple Distribution valide"; exit 1; }

          # Profil App Store : installé aux deux emplacements (Xcode ≤ 15 et ≥ 16).
          PROFILE="$RUNNER_TEMP/appstore.mobileprovision"
          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          PLIST="$(security cms -D -i "$PROFILE")"
          UUID="$(printf '%s' "$PLIST" | plutil -extract UUID raw -)"
          NAME="$(printf '%s' "$PLIST" | plutil -extract Name raw -)"
          APPID="$(printf '%s' "$PLIST" | plutil -extract Entitlements.application-identifier raw -)"
          [ "$APPID" = "$TEAM_ID.$BUNDLE_ID" ] || { echo "Le profil « $NAME » vise $APPID, pas $TEAM_ID.$BUNDLE_ID"; exit 1; }
          for d in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$d" && cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          echo "Profil « $NAME » ($UUID), expire le $(printf '%s' "$PLIST" | plutil -extract ExpirationDate raw -)"

          # Signature manuelle sur la cible Runner SEULEMENT : passer ces réglages
          # en argument de xcodebuild les appliquerait aussi aux Pods, qui refusent
          # tout profil. On remplace donc l'identité « iPhone Developer » des trois
          # configurations de Runner dans le pbxproj (checkout jetable du runner).
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's|"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";|"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"; CODE_SIGN_STYLE = Manual; PROVISIONING_PROFILE_SPECIFIER = "'"$NAME"'";|' "$PBX"
          N=$(grep -c 'PROVISIONING_PROFILE_SPECIFIER = "'"$NAME"'"' "$PBX")
          [ "$N" -ge 1 ] || { echo "pbxproj non modifié : l'identité « iPhone Developer » de Runner a disparu ?"; exit 1; }
          echo "$N configuration(s) Runner passée(s) en signature manuelle"

          # ExportOptions dérivé du plist App Store, en manuel.
          cp ios/ExportOptions-appstore.plist build/ExportOptions-manual.plist
          /usr/libexec/PlistBuddy -c 'Set :signingStyle manual' \
            -c 'Add :signingCertificate string "Apple Distribution"' \
            -c 'Add :provisioningProfiles dict' \
            -c "Add :provisioningProfiles:$BUNDLE_ID string \"$NAME\"" build/ExportOptions-manual.plist
          echo "style=manual" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          STYLE: ${{ steps.signing.outputs.style }}
        run: |
          set -o pipefail
          if [ "$STYLE" = "manual" ]; then
            SIGN_ARGS=(DEVELOPMENT_TEAM="$TEAM_ID")
          else
            SIGN_ARGS=(-allowProvisioningUpdates -allowProvisioningDeviceRegistration
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
              -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
              CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID")
          fi
          xcodebuild -workspace ios/Runner.xcworkspace -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive archive \
            "${SIGN_ARGS[@]}" \
            | tee build/xcodebuild-archive.log | grep -E 'ARCHIVE|error:|warning: .*(signing|provision)' || true
          test -d build/ios/archive/Runner.xcarchive || { echo "Archive absente, voir le log"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' \
            build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist

      - name: Export IPA (App Store Connect)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          STYLE: ${{ steps.signing.outputs.style }}
        run: |
          set -o pipefail
          if [ "$STYLE" = "manual" ]; then
            EXPORT_ARGS=(-exportOptionsPlist build/ExportOptions-manual.plist)
          else
            EXPORT_ARGS=(-exportOptionsPlist ios/ExportOptions-appstore.plist -allowProvisioningUpdates
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
              -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          fi
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa "${EXPORT_ARGS[@]}" \
            | tee build/xcodebuild-export.log | grep -E 'EXPORT|error:' || true
          ls -la build/ios/ipa/*.ipa

      - name: Nettoyage du trousseau
        if: always() && steps.signing.outputs.style == 'manual'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Upload vers App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Pas de « | head » ici : couper la sortie tue l'upload en cours.
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > build/altool.log 2>&1 || true
          grep -iE 'UPLOAD (SUCCEEDED|FAILED)|Delivery UUID|ERROR' build/altool.log
          grep -q 'UPLOAD SUCCEEDED' build/altool.log

      - name: Logs et IPA en artefacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.number }}
          path: |
            build/ios/ipa/*.ipa
            build/xcodebuild-archive.log
            build/xcodebuild-export.log
            build/altool.log
          if-no-files-found: ignore
          retention-days: 14

  store-notes:
    name: Notes App Store Connect
    needs: build-upload
    if: startsWith(github.ref, 'refs/tags/')
    # Simple attente d'Apple (traitement 10 à 30 min) : runner Linux, pas macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Notes TestFlight (+ version App Store sur release-v*)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          args="--build-number=${{ needs.build-upload.outputs.build_number }}"
          if [[ "${GITHUB_REF_NAME}" == release-v* ]]; then args="$args --app-store"; fi
          node tool/app_store_connect_release.mjs $args
