# Codemagic — build + upload TestFlight iOS (sans Mac local)
# Docs setup : docs/DEPLOY_IOS.md § Codemagic
#
# Prérequis UI Codemagic (une fois) :
# 1. Team integrations → Developer Portal → clé API nommée "ViroTeam"
# 2. Code signing identities → générer/fetcher cert Distribution + profil App Store
#    pour com.viroteam.viroTeam
# 3. Application → Environment variables → groupe "ios_secrets" :
#    - GOOGLE_SERVICE_INFO_PLIST (fichier GoogleService-Info.plist en base64)
#    - APP_STORE_APPLE_ID (App Store Connect → Général → Infos sur l’app → Apple ID)

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ViroTeam
    environment:
      groups:
        - ios_secrets
      flutter: fvm
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.viroteam.viroTeam
      vars:
        BUNDLE_ID: com.viroteam.viroTeam
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          set -e
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "Missing GOOGLE_SERVICE_INFO_PLIST (groupe ios_secrets)"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          test -s ios/Runner/GoogleService-Info.plist
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          set -e
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "Missing APP_STORE_APPLE_ID (groupe ios_secrets)"
            exit 1
          fi
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT_BUILD=$((LATEST_BUILD + 1))
          echo "TestFlight build number → $NEXT_BUILD (après $LATEST_BUILD)"
          flutter build ipa --release \
            --build-number="$NEXT_BUILD" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Groupe TestFlight interne déjà créé dans App Store Connect
        beta_groups:
          - Interne
        submit_to_app_store: false
