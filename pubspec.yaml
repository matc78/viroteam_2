name: viro_team_v2
description: "ViroTeam v2 — gestion sportive (invitation uniquement)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^6.3.0
  app_links: ^6.4.0
