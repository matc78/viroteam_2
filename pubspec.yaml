name: viro_team_v2
description: "ViroTeam v2 — gestion sportive (invitation uniquement)."
publish_to: 'none'
version: 2.1.2+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^6.3.0
  app_links: ^6.4.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.0.6
  firebase_storage: ^13.0.5
  cloud_firestore: ^6.1.1
  cloud_functions: ^6.0.5
  url_launcher: ^6.3.2
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  image_picker: ^1.2.1
  phosphoricons_flutter: ^1.0.0
  intl: ^0.20.2
  add_2_calendar: ^3.1.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  posthog_flutter: ^4.8.1
  shared_preferences: ^2.5.3
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  background_image: assets/branding/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_logo.png
  ios: true
  android: true
  web: false

flutter:

  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icons/
    - assets/sons/
    - assets/branding/
